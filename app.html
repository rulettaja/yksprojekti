<!DOCTYPE html>
<html lang="fi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opiskelijaravintolat</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/fetchData.js" defer></script>
  <script src="js/app.js" defer></script>
</head>

<body>

  <!-- ======= HEADER ======= -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="header-icon" aria-hidden="true">🍽️</span>
        <h1 class="header-title">Opiskelijaravintolat</h1>
      </div>
      <nav class="header-nav">
        <button type="button" id="btn-show-login" class="nav-btn">Kirjaudu</button>
        <button type="button" id="btn-show-register" class="nav-btn nav-btn--primary">Rekisteröidy</button>
      </nav>
    </div>
  </header>

  <!-- ======= MAIN CONTENT ======= -->
  <main class="main-content">

    <!-- FILTER BAR -->
    <section class="filter-bar" aria-label="Suodattimet">
      <div class="filter-group">
        <label class="filter-label" for="filter-city">Kaupunki</label>
        <select id="filter-city" class="filter-select">
          <option value="">Kaikki kaupungit</option>
        </select>
      </div>
      <div class="filter-group">
        <label class="filter-label" for="filter-company">Palveluntarjoaja</label>
        <select id="filter-company" class="filter-select">
          <option value="">Kaikki palveluntarjoajat</option>
        </select>
      </div>
      <div class="filter-group filter-group--search">
        <label class="filter-label" for="filter-search">Haku</label>
        <input id="filter-search" class="filter-input" type="search" placeholder="Etsi ravintolaa…" aria-label="Etsi ravintolaa">
      </div>
    </section>

    <!-- STATUS / LOADING -->
    <p id="loading-msg" class="loading-msg" role="status" aria-live="polite">Ladataan ravintoloita…</p>

    <!-- RESTAURANT TABLE -->
    <div class="table-wrapper">
      <table id="target" aria-label="Ravintolalista">
        <thead>
          <tr>
            <th scope="col">Nimi</th>
            <th scope="col">Osoite</th>
            <th scope="col">Kaupunki</th>
            <th scope="col">Palveluntarjoaja</th>
          </tr>
        </thead>
        <tbody>
          <!-- Ravintolarivit lisätään JS:llä -->
        </tbody>
      </table>
    </div>

  </main>

  <!-- ======= FOOTER ======= -->
  <footer class="site-footer">
    <p>TX00EY23 Web-sovelluskehitys &mdash; Yksilötehtävä &copy; 2025</p>
  </footer>

  <!-- ======= RESTAURANT MODAL ======= -->
  <dialog id="modal" aria-modal="true" aria-labelledby="modal-restaurant-name">
    <!-- Sisältö lisätään JS:llä -->
  </dialog>

  <!-- ======= LOGIN MODAL ======= -->
  <dialog id="modal-auth" aria-modal="true" aria-labelledby="auth-modal-title">
    <div class="auth-modal-inner">

    <!-- Close row -->
    <div class="auth-close-row">
      <button type="button" class="close-modal close-modal--auth" aria-label="Sulje">&#x2715;</button>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab auth-tab--active" id="tab-login" role="tab" aria-selected="true" aria-controls="panel-login">Kirjaudu</button>
      <button type="button" class="auth-tab" id="tab-register" role="tab" aria-selected="false" aria-controls="panel-register">Rekisteröidy</button>
    </div>

    <!-- Login panel -->
    <div id="panel-login" class="auth-panel" role="tabpanel" aria-labelledby="tab-login">
      <h2 id="auth-modal-title" class="auth-title">Kirjaudu sisään</h2>
      <form id="form-login" class="auth-form" novalidate>
        <div class="field-group">
          <label class="field-label" for="login-email">Sähköposti</label>
          <input id="login-email" type="email" class="field-input" placeholder="nimi@esimerkki.fi" autocomplete="email" required>
        </div>
        <div class="field-group">
          <label class="field-label" for="login-password">Salasana</label>
          <input id="login-password" type="password" class="field-input" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <p id="login-error" class="auth-error" role="alert" hidden></p>
        <button type="submit" class="btn-primary btn-full">Kirjaudu</button>
      </form>
    </div>

    <!-- Register panel -->
    <div id="panel-register" class="auth-panel auth-panel--hidden" role="tabpanel" aria-labelledby="tab-register">
      <h2 class="auth-title">Luo tili</h2>
      <form id="form-register" class="auth-form" novalidate>
        <div class="field-group">
          <label class="field-label" for="reg-name">Nimi</label>
          <input id="reg-name" type="text" class="field-input" placeholder="Etunimi Sukunimi" autocomplete="name" required>
        </div>
        <div class="field-group">
          <label class="field-label" for="reg-email">Sähköposti</label>
          <input id="reg-email" type="email" class="field-input" placeholder="nimi@esimerkki.fi" autocomplete="email" required>
        </div>
        <div class="field-group">
          <label class="field-label" for="reg-password">Salasana</label>
          <input id="reg-password" type="password" class="field-input" placeholder="••••••••" autocomplete="new-password" required>
        </div>
        <p id="register-error" class="auth-error" role="alert" hidden></p>
        <button type="submit" class="btn-primary btn-full">Rekisteröidy</button>
      </form>
    </div>

    </div><!-- /.auth-modal-inner -->
  </dialog>

</body>
</html>
